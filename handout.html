$('#theme').onclick=()=>{root.classList.toggle('dark');try{localStorage.setItem('qk-handout-theme',root.classList.contains('dark')?'dark':'light')}catch(e){}};
/* routing */
const maps={},BASE=document.title;
function show(){let h=decodeURIComponent(location.hash.slice(1))||'home';let [id,arg]=h.split('~');let el,view;
 if(id.startsWith('p-')){el=document.getElementById(id);view=el&&el.dataset.view}else{el=document.getElementById('v-'+id);view=id}
 if(!el){el=document.getElementById('v-home');view='home';arg=null}
 $$('.pg').forEach(s=>s.classList.toggle('show',s===el));$$('nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===view));
 scrollTo(0,0);if(view==='bible'&&id==='bible')famFilter(arg||'');
 const mp=el.querySelector('.hmap');if(mp){const M=maps[mp.dataset.map]||(maps[mp.dataset.map]=initMap(mp));M.fit();if(arg)setTimeout(()=>M.focus(arg),50)}
 const t=el.querySelector('h1');document.title=(t&&el.id!=='v-home'?t.textContent+' · ':'')+BASE}
addEventListener('hashchange',show);
/* bible filter */
function famFilter(f){$$('[data-fam]').forEach(b=>b.classList.toggle('on',b.dataset.fam===f));$$('[data-famsec]').forEach(s=>s.style.display=!f||s.dataset.famsec===f?'':'none')}
$$('[data-fam]').forEach(b=>b.onclick=()=>{history.replaceState(null,'','#bible'+(b.dataset.fam?'~'+b.dataset.fam:''));famFilter(b.dataset.fam)});
/* search */
const q=$('#q'),qr=$('#qr');let sel=0;
const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
function runQ(){const v=norm(q.value.trim());if(!v){qr.hidden=true;return}const res=SEARCH.map(x=>{const t=norm(x.t),s=norm(x.s);const sc=t.startsWith(v)?3:t.includes(v)?2:s.includes(v)?1:0;return[sc,x]}).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]||a[1].t.localeCompare(b[1].t)).slice(0,12);sel=0;
 qr.innerHTML=res.length?res.map(([,x],i)=>'<a href="#p-'+x.id+'" class="'+(i?'':'sel')+'">'+esc(x.t)+'<small>'+esc(x.k)+'</small>'+(x.s?'<i>'+esc(x.s)+'</i>':'')+'</a>').join(''):'<a>No matches</a>';qr.hidden=false}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
q.oninput=runQ;q.onfocus=runQ;q.onkeydown=e=>{const as=$$('a',qr);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as.forEach((a,i)=>a.classList.toggle('sel',i===sel))}else if(e.key==='Enter'&&as[sel]){as[sel].click();q.blur()}else if(e.key==='Escape')q.blur()};
q.onblur=()=>setTimeout(()=>qr.hidden=true,150);qr.onclick=()=>{q.value='';qr.hidden=true};
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
/* interactive maps: pan, zoom (wheel, buttons, pinch) and pin cards */
function initMap(el){const svg=el.querySelector('svg'),W=+el.dataset.w,H=+el.dataset.h,id=el.dataset.map,pop=el.querySelector('.mpop'),F=el.dataset.fit?el.dataset.fit.split(',').map(Number):[0,0,W,H];let vb=F.slice();
 const apply=()=>{svg.setAttribute('viewBox',vb.join(' '));const s=vb[2]/(svg.clientWidth||W);el.querySelectorAll('.hp').forEach(g=>g.setAttribute('transform','translate('+g.dataset.x+','+g.dataset.y+') scale('+s*(+g.dataset.s||1)+')'));el.querySelectorAll('.fx').forEach(g=>g.setAttribute('transform','translate('+g.dataset.x+','+g.dataset.y+') scale('+s+')'))};
 const clampV=()=>{vb[2]=Math.min(W,Math.max(W/25,vb[2]));vb[3]=vb[2]*H/W;vb[0]=Math.min(W-vb[2],Math.max(0,vb[0]));vb[1]=Math.min(H-vb[3],Math.max(0,vb[1]))};
 const zoomAt=(f,cx,cy)=>{const nw=Math.min(W,Math.max(W/25,vb[2]/f)),k=nw/vb[2];vb=[cx-(cx-vb[0])*k,cy-(cy-vb[1])*k,nw,nw*H/W];clampV();apply()};
 const toMap=(x,y)=>{const r=svg.getBoundingClientRect();return[vb[0]+(x-r.left)/r.width*vb[2],vb[1]+(y-r.top)/r.height*vb[3]]};
 el.addEventListener('wheel',e=>{e.preventDefault();hide();const[mx,my]=toMap(e.clientX,e.clientY);zoomAt(Math.exp(-e.deltaY*.0018),mx,my)},{passive:false});
 const pts=new Map();let st=null,moved=false;
 el.addEventListener('pointerdown',e=>{if(e.target.closest('.mz,.mpop'))return;pts.set(e.pointerId,[e.clientX,e.clientY]);el.setPointerCapture(e.pointerId);moved=false;st={vb:vb.slice(),p:[e.clientX,e.clientY],d:pts.size===2?dist():0,c:pts.size===2?mid():null,t:e.target.closest('.hp,.hreg.click')};el.classList.add('drag')});
 const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])},mid=()=>{const a=[...pts.values()];return[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]};
 el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!st)return;pts.set(e.pointerId,[e.clientX,e.clientY]);const r=svg.getBoundingClientRect();
  if(pts.size===2){if(!st.d){st={vb:vb.slice(),d:dist(),c:mid()};return}const k=st.d/dist(),c=mid(),nw=Math.min(W,Math.max(W/25,st.vb[2]*k));const cx=st.vb[0]+(st.c[0]-r.left)/r.width*st.vb[2],cy=st.vb[1]+(st.c[1]-r.top)/r.height*st.vb[3];vb=[cx-(c[0]-r.left)/r.width*nw,cy-(c[1]-r.top)/r.height*nw*H/W,nw,nw*H/W];moved=true;clampV();apply();return}
  const dx=e.clientX-st.p[0],dy=e.clientY-st.p[1];if(Math.hypot(dx,dy)>4)moved=true;if(!moved)return;hide();vb[0]=st.vb[0]-dx/r.width*vb[2];vb[1]=st.vb[1]-dy/r.height*vb[3];clampV();apply()});
 const up=e=>{pts.delete(e.pointerId);if(!pts.size){el.classList.remove('drag');if(!moved&&st){const g=st.t;if(g)open(g.dataset.id,e);else hide()}st=null}else st={vb:vb.slice(),p:[...pts.values()][0],d:0}};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(!z){vb=F.slice();apply();return}zoomAt(z,vb[0]+vb[2]/2,vb[1]+vb[3]/2)});
 function hide(){pop.hidden=true}
 function open(pid,e){const p=(PINS[id]||{})[pid];if(!p)return;const r=el.getBoundingClientRect();
  pop.innerHTML='<button class="x">×</button>'+(p.k?'<small>'+esc(p.k)+'</small>':'')+'<b>'+esc(p.t)+'</b>'+(p.s?'<p>'+esc(p.s)+'</p>':'<p></p>')+(p.l?'<a href="#p-'+p.l+'">Read more →</a>':'')+(p.m?'<a href="#p-'+p.m+'">Open map →</a>':'');
  pop.hidden=false;let x=e.clientX-r.left+14,y=e.clientY-r.top-20;x=Math.min(x,r.width-284);if(x<6)x=6;y=Math.min(y,r.height-pop.offsetHeight-8);if(y<6)y=6;pop.style.left=x+'px';pop.style.top=y+'px';pop.querySelector('.x').onclick=hide}
 return{fit(){vb=F.slice();hide();requestAnimationFrame(apply)},focus(pid){const g=el.querySelector('[data-id="'+pid+'"]');if(!g)return;let x=+g.dataset.x,y=+g.dataset.y;if(isNaN(x)){const b=g.getBBox();x=b.x+b.width/2;y=b.y+b.height/2}const nw=W/3.5;vb=[x-nw/2,y-nw*H/W/2,nw,nw*H/W];clampV();apply();g.classList.remove('flash');void g.getBBox();g.classList.add('flash');el.scrollIntoView({block:'center',behavior:'smooth'})}}}
addEventListener('resize',()=>Object.values(maps).forEach(m=>m.fit()));
show();

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const PWK='qk-pw:'+BASE;
async function unlock(pw){pw=String(pw||'').trim().toLowerCase().replace(/\s+/g,'-');if(!pw||!window.crypto||!crypto.subtle)return null;const enc=new TextEncoder();
 for(const s of SECRETS){try{const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(s.s),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(s.i)},key,b64d(s.c));return JSON.parse(new TextDecoder().decode(pt))}catch(e){}}return null}
let ME=null;
function applySecrets(d){ME=d;const lb=$('#login');lb.innerHTML=ICO_KEY+'<span>'+esc(d.name)+'</span>';lb.title='Logged in as '+d.name+'. Click to log out';
 for(const [id,h] of Object.entries(d.inserts||{})){const pg=document.getElementById('p-'+id);if(!pg)continue;const box=document.createElement('div');box.className='mine-box';box.innerHTML=h;(pg.querySelector('.prose')||pg).appendChild(box)}
 const main=$('main'),nav=$('nav');const cards=(d.pages||[]).map(p=>'<a class="rcard" href="#p-'+p.id+'" style="--tc:var(--mine)"><span class="ri">'+ICO_KEY+'</span><span class="mw0"><small>Just for you</small><b>'+esc(p.title)+'</b></span></a>').join('');
 (d.pages||[]).forEach(p=>{const s=document.createElement('section');s.className='pg';s.id='p-'+p.id;s.dataset.view='mine';s.innerHTML='<div class="crumbs"><a href="#mine">Just for you</a></div>'+p.html;main.appendChild(s);SEARCH.push({id:p.id,t:p.title,k:'Just for you',s:''})});
 const v=document.createElement('section');v.className='pg view';v.id='v-mine';v.innerHTML='<h1>Just for you, '+esc(d.name)+'</h1><p class="lead">Things only your character knows. Nobody else who opens this handout can see them.</p>'+(d.inbox?'<p><button class="btnq" id="writeJ">'+ICO_PEN+' Write in your journal</button></p>':'')+(cards?'<div class="cards sm">'+cards+'</div>':'<p class="muted">Nothing secret yet.</p>')+((d.notes||[]).length?'<h2>Notes on other pages</h2><p class="muted small">These pages have a gold box only you can see.</p><div class="cards sm">'+d.notes.map(n=>'<a class="rcard" href="#p-'+n.id+'" style="--tc:var(--mine)"><span class="ri">'+ICO_KEY+'</span><span class="mw0"><small>Note for you on</small><b>'+esc(n.t)+'</b></span></a>').join('')+'</div>':'');main.prepend(v);
 const a=document.createElement('a');a.href='#mine';a.dataset.nav='mine';a.innerHTML=ICO_KEY+'<span>Just for you</span>';nav.appendChild(a);
 $('#writeJ')&&($('#writeJ').onclick=()=>journalForm(d));show()}
function loginForm(){const w=document.createElement('div');w.className='qmodal';w.innerHTML='<form class="qbox"><h2>Player login</h2><p class="muted">Your GM gave you a password. It unlocks the parts of this handout meant only for your character.</p><input id="pw" placeholder="e.g. amber-otter-42" autocomplete="current-password" autocapitalize="off"><p class="err" hidden>That password didn\'t match anyone. Check it with your GM.</p><div class="qrow2"><button type="button" class="btnq ghost" data-x>Cancel</button><button class="btnq">Unlock</button></div></form>';document.body.appendChild(w);
 const f=w.querySelector('form');w.querySelector('[data-x]').onclick=()=>w.remove();setTimeout(()=>$('#pw',w).focus(),30);
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button:last-child');b.disabled=true;b.textContent='Checking…';const pw=$('#pw',w).value,d=await unlock(pw);b.disabled=false;b.textContent='Unlock';if(!d){f.querySelector('.err').hidden=false;return}try{localStorage.setItem(PWK,pw)}catch(e){}w.remove();applySecrets(d);location.hash='#mine'}}
function journalForm(d){const w=document.createElement('div');w.className='qmodal';w.innerHTML='<form class="qbox"><h2>Write in your journal</h2><p class="muted">Your GM reads it, then adds it to <b>'+esc(d.inbox.journal)+'</b>.</p><input id="jt" placeholder="Title (optional)"><textarea id="jb" rows="10" placeholder="What happened, in your character\'s words…" required></textarea><p class="err" hidden></p><div class="qrow2"><button type="button" class="btnq ghost" data-x>Cancel</button><button class="btnq">Send to GM</button></div></form>';document.body.appendChild(w);
 const f=w.querySelector('form'),er=f.querySelector('.err');w.querySelector('[data-x]').onclick=()=>w.remove();let draft='';try{draft=localStorage.getItem('qk-jdraft')||''}catch(e){}$('#jb',w).value=draft;$('#jb',w).oninput=e=>{try{localStorage.setItem('qk-jdraft',e.target.value)}catch(x){}};
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button:last-child');b.disabled=true;b.textContent='Sending…';er.hidden=true;
  try{const r=await fetch(d.inbox.url.replace(/\/+$/,'')+'/submit',{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify({key:d.inbox.key,title:$('#jt',w).value,body:$('#jb',w).value})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||('error '+r.status));try{localStorage.removeItem('qk-jdraft')}catch(x){}f.innerHTML='<h2>Sent!</h2><p>Your GM will add it to your journal after reading it.</p><div class="qrow2"><button type="button" class="btnq">Close</button></div>';f.querySelector('button').onclick=()=>w.remove()}
  catch(x){er.textContent='Couldn\'t send it ('+x.message+'). Your text is kept here; try again in a moment.';er.hidden=false;b.disabled=false;b.textContent='Send to GM'}}}
if(SECRETS.length){const lb=$('#login');lb.hidden=false;lb.onclick=()=>{if(ME){if(confirm('Log out of '+ME.name+'?')){try{localStorage.removeItem(PWK)}catch(e){}location.hash='';location.reload()}}else loginForm()};
 let saved=null;try{saved=localStorage.getItem(PWK)}catch(e){}if(saved)unlock(saved).then(d=>d&&applySecrets(d))}
</script></body></html>
